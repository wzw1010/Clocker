<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clocker">
    <meta name="theme-color" content="#FF5E3A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FF6B44" media="(prefers-color-scheme: light)">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <title>Clocker</title>
    <style>
        :root {
            --bg-primary: #0A0A0C;
            --bg-card-solid: rgba(255, 255, 255, 0.08);
            --bg-input: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-input: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --color-hours: #34c759;
            --color-overtime: #5ac8fa;
            --color-salary: #F0B90B;
            --accent: #FF5E3A;
            --color-manual: #FF9F0A;
            --color-work: #68D4AA;
            --color-night: #8E8FFF;
            --color-rest: #AEAEB2;
            --color-holiday: #FFA040;
            --bg-work: rgba(104, 212, 170, 0.2);
            --bg-night: rgba(142, 143, 255, 0.2);
            --bg-rest: rgba(174, 174, 178, 0.2);
            --bg-holiday: rgba(255, 160, 64, 0.22);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --space-xs: 6px;
            --space-sm: 10px;
            --space-md: 16px;
            --space-lg: 24px;
            --font-caption: 12px;
            --font-body: 16px;
            --font-title: 20px;
            --font-large: 34px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --header-height: 60px;
            --corner-tag: #FF9500;
            --watermark-color: #ffffff;
            --watermark-opacity: 0.04;
            --menu-bg: rgba(20, 20, 25, 0.95);
            --menu-border: rgba(255,255,255,0.12);
        }

        [data-theme="light"] {
            --bg-primary: #f2f2f7;
            --bg-card-solid: rgba(255, 255, 255, 0.72);
            --bg-input: rgba(0, 0, 0, 0.06);
            --border-card: rgba(0, 0, 0, 0.08);
            --border-input: rgba(0, 0, 0, 0.12);
            --text-primary: #000000;
            --text-secondary: rgba(0, 0, 0, 0.55);
            --text-tertiary: rgba(0, 0, 0, 0.35);
            --accent: #FF5E3A;
            --color-manual: #E08800;
            --color-work: #34A87A;
            --color-night: #6A6BDF;
            --color-rest: #8E8E93;
            --color-holiday: #F0882A;
            --bg-work: rgba(104, 212, 170, 0.18);
            --bg-night: rgba(142, 143, 255, 0.18);
            --bg-rest: rgba(174, 174, 178, 0.22);
            --bg-holiday: rgba(255, 160, 64, 0.25);
            --shadow: 0 2px 10px rgba(0,0,0,0.06);
            --corner-tag: #FF9500;
            --watermark-color: #555555;
            --watermark-opacity: 0.04;
            --menu-bg: rgba(255, 255, 255, 0.92);
            --menu-border: rgba(0,0,0,0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { height:100%; }
        body {
            font-family: system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            padding-top: calc(var(--header-height) + var(--safe-top) + 8px);
            padding-bottom: calc(12px + var(--safe-bottom));
            position: relative;
        }
        body.modal-open { overflow: hidden; }

        .app { max-width:480px; margin:0 auto; padding:0 var(--space-md); position:relative; z-index:1; }

        .nav-header {
            position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:10;
            padding: calc(var(--safe-top) + 10px) var(--space-md) 12px;
            display:flex; align-items:center; gap:var(--space-sm);
            background: transparent;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            min-height: var(--header-height);
        }
        .header-title-group { display:flex; align-items:center; gap:8px; margin-right:auto; user-select: none; }
        .header-title { font-weight:700; font-size:var(--font-title); color:var(--text-primary); white-space: nowrap; cursor: default; }

        .nav-actions { display:flex; align-items:center; gap:4px; position: relative; }
        .more-btn {
            width:30px; height:30px; display:flex; align-items:center; justify-content:center;
            background:rgba(255,255,255,0.1);
            border: 0.5px solid rgba(255,255,255,0.18);
            border-radius:50%; cursor:pointer;
            color:var(--text-secondary); transition:all 0.2s;
            backdrop-filter: blur(10px);
        }
        .more-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
        .more-btn:active { background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.3); }
        [data-theme="light"] .more-btn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.12); color:#333; }
        [data-theme="light"] .more-btn:active { background:rgba(0,0,0,0.1); }

        .dropdown-menu {
            position: absolute; top: 100%; right: 0; margin-top: 6px;
            background: var(--menu-bg);
            border: 1px solid var(--menu-border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 4px; display: none; flex-direction: column; min-width: 170px; z-index: 20;
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu button {
            background: transparent; border: none; color: var(--text-primary);
            padding: 8px 12px; text-align: left; font-size: var(--font-caption);
            font-weight: 500; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%;
        }
        .dropdown-menu button:active { background: var(--bg-input); }
        .dropdown-menu button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
        .dropdown-menu .divider { height: 1px; background: var(--border-card); margin: 4px 8px; }

        .scroll-content { padding-top:var(--space-sm); }

        .section {
            background: var(--bg-card-solid);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border:1px solid var(--border-card); border-radius:var(--radius-md); margin-bottom:16px; overflow:hidden;
            box-shadow:var(--shadow);
            position: relative;
        }

        .stat-header {
            display:flex; align-items:center; gap:var(--space-sm); padding:var(--space-md); cursor:pointer;
            position: relative; z-index: 1;
        }
        .stat-left { display:flex; flex-direction:column; gap:2px; flex:1; }
        .stat-label { font-size:var(--font-caption); color:var(--text-secondary); font-weight:600; letter-spacing:0.3px; text-transform:uppercase; }
        .stat-value { font-size:var(--font-large); font-weight:700; color:var(--text-primary); line-height:1.1; }
        .stat-right { display:flex; align-items:center; gap:8px; }
        .stat-right svg.stat-icon { width:44px; height:44px; stroke:currentColor; fill:none; stroke-width:1.8; }
        .progress-ring { width:44px; height:44px; }
        .progress-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
        .ring-bg { stroke:rgba(128,128,128,0.15); }
        .ring-fill { transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        #workHoursSection .stat-value { color: var(--color-hours); }
        #workHoursSection .ring-fill { stroke: var(--color-hours); }
        #overtimePaySection .stat-value { color: var(--color-overtime); }
        #overtimePaySection .stat-icon { stroke: var(--color-overtime); }
        #salarySection .stat-value { color: var(--color-salary); }
        #salarySection .stat-icon { stroke: var(--color-salary); }

        .card-body-wrapper {
            height: 0;
            overflow: hidden;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 1;
        }
        .card-body-inner {
            padding: 0 var(--space-md) var(--space-md);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .section.open .card-body-inner { opacity: 1; }
        .section.open .stat-header .chevron { transform: rotate(90deg); }
        .section.open .stat-header { border-bottom: 1px solid var(--border-card); }
        .chevron { transition: transform 0.25s ease; }

        .overtime-row, .detail-row {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 0; border-bottom:1px solid var(--border-card); font-size:var(--font-caption);
        }
        .overtime-row:last-child, .detail-row:last-child { border-bottom:none; }
        .overtime-label, .detail-label { color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
        .overtime-label svg, .detail-label svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.5; }
        .overtime-value, .detail-value { font-weight:600; }

        .editable-full-hours, .editable-manual-overtime {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--color-hours); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
        }
        .editable-full-hours input, .editable-manual-overtime input {
            background: transparent; border: none; outline: none;
            color: var(--color-hours); font-size: inherit; font-weight: inherit;
            font-family: inherit; width: 60px; text-align: center;
            -webkit-appearance: none; box-shadow: none; display: none;
        }
        .editable-full-hours.editing .display-text,
        .editable-manual-overtime.editing .display-text { display: none; }
        .editable-full-hours.editing input,
        .editable-manual-overtime.editing input { display: inline-block; }
        .editable-full-hours .edit-icon, .editable-manual-overtime .edit-icon { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
        .editable-manual-overtime { color: var(--color-overtime); }
        .editable-manual-overtime input { color: var(--color-overtime); }

        .reset-icon-btn {
            background: none; border: none; cursor: pointer; padding: 2px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--text-secondary); margin-left: 4px;
        }
        .reset-icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

        .salary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-sm); padding:var(--space-sm) 0; }
        .salary-item { background:var(--bg-input); border-radius:var(--radius-sm); padding:var(--space-sm); text-align:center; position:relative; }
        .salary-item .item-label {
            font-size:10px; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:4px;
        }
        .salary-item .item-label svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.5; }
        .salary-item .item-input {
            background:transparent; border:none; color:var(--text-primary);
            font-size:var(--font-body); font-weight:600; text-align:center;
            width:100%; outline:none; font-family:inherit;
        }
        .salary-item .item-input.manual { color: var(--color-manual); }
        .salary-item .auto-hint {
            position:absolute; top:6px; right:8px; font-size:9px;
            color:var(--text-tertiary); font-weight:600;
        }
        .salary-item .item-input.manual ~ .auto-hint { color: var(--color-manual); }

        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:var(--space-md); }
        .cal-day {
            aspect-ratio:1/1; background:var(--bg-card-solid); border-radius:var(--radius-sm);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            cursor:pointer; transition:transform 0.15s; border:1px solid transparent;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            position:relative;
        }
        .cal-day:active { transform:scale(0.94); }
        .cal-day.empty { background:transparent; backdrop-filter:none; pointer-events:none; }
        .cal-day.work { background:var(--bg-work); border-color:rgba(104,212,170,0.25); }
        .cal-day.night { background:var(--bg-night); border-color:rgba(142,143,255,0.25); }
        .cal-day.rest { background:var(--bg-rest); border-color:rgba(174,174,178,0.25); }
        .cal-day.holiday { background:var(--bg-holiday); border-color:rgba(255,160,64,0.3); }
        .day-number { font-size:var(--font-body); font-weight:600; }
        .day-label { font-size:9px; font-weight:600; color:var(--text-secondary); margin-top:1px; }

        .corner-tag {
            position: absolute; top:0; left:0;
            width:0; height:0;
            border-style: solid;
            border-width: 10px 10px 0 0;
            border-color: var(--corner-tag) transparent transparent transparent;
            border-radius: 2px 0 0 0;
        }

        .card-watermark {
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 800;
            letter-spacing: 0;
            color: var(--watermark-color);
            opacity: var(--watermark-opacity);
            pointer-events: none;
            z-index: 0;
            line-height: 1;
            white-space: nowrap;
        }

        .modal-overlay {
            position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            opacity:0; pointer-events:none; transition:opacity 0.3s;
        }
        .modal-overlay.show { opacity:1; pointer-events:auto; }
        .modal-content {
            width:85%; max-width:400px; background:var(--bg-card-solid);
            border-radius:var(--radius-lg); padding:var(--space-lg); box-shadow:var(--shadow);
            display:flex; flex-direction:column; gap:var(--space-md);
            transform:scale(0.9); transition:transform 0.35s; border:1px solid var(--border-card);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        .modal-overlay.show .modal-content { transform:scale(1); }
        .modal-shift-selector { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-xs); }
        .shift-option-big {
            background:var(--bg-input); border:1px solid var(--border-input); border-radius:var(--radius-sm);
            padding:8px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
            color:var(--text-secondary); transition:all 0.2s;
        }
        .shift-option-big svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }
        .shift-option-big .shift-text { font-size:10px; font-weight:600; }
        .shift-option-big.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .modal-hours-row { display:flex; gap:8px; }
        .modal-hours-row .input-field { flex:1; }
        .btn-save {
            background:var(--accent); border:none; color:#fff; border-radius:var(--radius-sm);
            padding:12px; font-weight:700; font-size:var(--font-body); cursor:pointer;
        }
        .input-field {
            background:var(--bg-input); border:1px solid var(--border-input); border-radius:var(--radius-sm);
            padding:10px 12px; font-size:var(--font-body); font-weight:600; color:var(--text-primary);
            text-align:center; width:100%; font-family:inherit; outline:none;
            transition:border-color 0.2s; -webkit-appearance:none;
        }
        .input-field:focus { border-color: var(--accent); }

        .toast-msg {
            position:fixed; bottom:calc(20px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
            background:var(--bg-card-solid); padding:10px 24px; border-radius:50px;
            font-size:var(--font-caption); z-index:200; opacity:0; transition:0.3s;
            box-shadow:var(--shadow); pointer-events:none;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            white-space: nowrap;
        }
        .toast-msg.show { opacity:1; bottom:calc(30px + var(--safe-bottom)); }
        .calendar-section { transition:opacity 0.25s; }
        .calendar-section.hidden { opacity:0; pointer-events:none; }

        @media print {
            body { padding-top:0!important; background:white!important; color:black!important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
            .nav-header, .modal-overlay, .toast-msg, .dropdown-menu { display:none!important; }
            .app { max-width:100%; padding:0 10px; }
            .section { box-shadow:none; border:1px solid #ccc; background:white!important; break-inside:avoid; }
            .card-body-wrapper { height: auto !important; }
            .card-body-inner { opacity: 1 !important; }
            .chevron { display: none; }
            .stat-value, .detail-value, .overtime-value { color:black!important; }
            .stat-label, .detail-label, .overtime-label { color:#555!important; }
            .cal-day { background:#f0f0f0!important; border:1px solid #ddd!important; color:black!important; }
            .cal-day.work { background:#d4edda!important; }
            .cal-day.night { background:#d1d4ff!important; }
            .cal-day.rest { background:#e2e2e2!important; }
            .cal-day.holiday { background:#ffe5cc!important; }
        }
    </style>
    <script>
        (function(){
            var mq = window.matchMedia('(prefers-color-scheme: light)');
            function apply() {
                if (mq.matches) document.documentElement.setAttribute('data-theme', 'light');
                else document.documentElement.removeAttribute('data-theme');
            }
            apply();
            if (mq.addEventListener) mq.addEventListener('change', apply);
            else if (mq.addListener) mq.addListener(apply);
        })();
    </script>
</head>

<script>
(function(){
    'use strict';

    // ===== 常量 =====
    const STORAGE_PREFIX = 'wh_v53_';
    const SALARY_PREFIX = 'sc_v45_';
    const FULL_HOURS_PREFIX = 'fh_v35_';
    const FULL_HOURS_LEGACY = 'fh_v35';
    const EXPANDED_KEY = 'expanded_sections_v1';
    const LANG_KEY = 'lang_pref';
    const DEF_NORMAL = 8, DEF_OVERTIME = 4;
    const MIN_YEAR = 2026, MAX_YEAR = 2099;
    const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // ===== 内置标准工时表 =====
    // 规则：实际工作日（周一至周五，扣除法定节假日，加上调休补班）× 8 小时
    // 数据来源：2026 年国务院放假安排
    const BUILTIN_HOURS = {
        '2026_1': 168,  // 元旦 1/1 放假，1/4 周日补班
        '2026_2': 128,  // 春节 9 天假，2/14、2/28 两个周六补班
        '2026_3': 176,
        '2026_4': 168,  // 清明 4/4-4/6
        '2026_5': 152,  // 劳动节 5 天假，5/9 周六补班
        '2026_6': 168,  // 端午 6/19-6/21
        '2026_7': 184,
        '2026_8': 168,
        '2026_9': 176,
        '2026_10': 144, // 国庆 7 天假，9/20、10/10 两个周末补班
        '2026_11': 168,
        '2026_12': 184
    };

    // ===== i18n 字典 =====
    const I18N = {
        en: {
            prevMonth: 'Prev Month',
            nextMonth: 'Next Month',
            exportBackup: 'Export Backup',
            importBackup: 'Import Backup',
            clearMonth: 'Clear Month',

            netSalary: 'Net Salary',

            regularOT: 'Regular OT',
            holidayOT: 'Holiday OT',

            resetAuto: 'Reset to auto',
            base: 'Base',
            perf: 'Perf.',
            deduct: 'Deduct',

            insurance: 'Insurance',

            rent: 'Rent',

            heat: 'Heat',

            nightShift: 'Night',
            rest: 'Rest',
            holidayShift: 'Holiday',
            normalHrs: 'Normal hrs',
            overtimeHrs: 'Overtime hrs',
            save: 'Save',
            calDay: 'Day',
            calNight: 'Night',
            calRest: 'Rest',
            calHoliday: 'Hol',
            hoursSaved: 'Hours saved',
            setTo: 'Set to ',
            monthCleared: 'Month cleared',
            backupExported: 'Backup exported',
            backupRestored: 'Backup restored',
            storageFull: 'Storage full',
            newVersion: 'New version available',
            eggText: '🎉 You got this!',
            confirmClear: 'Clear all scheduling and hours data for the current month? This only affects the current month.',
            invalidBackup: 'Invalid or corrupted backup file'
        },
        zh: {
            prevMonth: '上个月',
            nextMonth: '下个月',
            exportBackup: '导出备份',
            importBackup: '导入备份',
            clearMonth: '清空本月',
            paidHours: '计薪工时',
            fullLabel: '标准',
            otPay: '加班费',
            regular: '平时',
            holidayLabel: '节假日',
            netSalary: '实发工资',
            gross: '应发',
            normal: '正常',
            overtime: '加班',
            holiday: '节假日',
            fullTime: '标准工时',
            regularOT: '平时加班',
            holidayOT: '节假日加班',
            manual: '手动调整',
            resetAuto: '恢复自动计算',
            base: '基本工资',
            perf: '绩效',
            deduct: '其他扣款',
            allow: '其他补贴',
            insurance: '社保',
            tax: '个税',
            meal: '餐补',
            night: '夜班补贴',
            rent: '房租',
            dining: '餐费',
            heat: '高温补贴',
            seniority: '工龄补贴',
            day: '白班',
            nightShift: '夜班',
            rest: '休息',
            holidayShift: '节假日',
            normalHrs: '正常工时',
            overtimeHrs: '加班工时',
            save: '保存',
            calDay: '白班',
            calNight: '夜班',
            calRest: '休息',
            calHoliday: '节假',
            hoursSaved: '已保存',
            setTo: '已设为',
            monthCleared: '本月已清空',
            backupExported: '备份已导出',
            backupRestored: '备份已恢复',
            storageFull: '存储空间不足',
            newVersion: '新版本可用',
            eggText: '🎉 加油！',
            confirmClear: '确定要清空本月的排班与工时数据吗？仅影响当前月份。',
            invalidBackup: '备份文件无效或已损坏'
        }
    };

    let currentLang = 'zh';
    function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || key; }

    // ===== 状态 =====
    let year, month, data = [];
    let selectedDay = null;
    let fullWorkHours = 0;
    let salaryConfig = createDefaultSalaryConfig();

    function createDefaultSalaryConfig() {
        return {
            baseSalary: 0, performance: 0, otherDeduction: 0, otherAllowance: 0,
            insuranceDeduction: 0, personalTax: 0,
            manualOvertimePay: null,
            rentDeduction: 0, mealFeeDeduction: 0,
            highTempAllowance: 0, seniorityAllowance: 0,
            mealManual: null,
            nightAllowanceManual: null
        };
    }

    const $ = id => document.getElementById(id);
    const cardsWrapper = $('cardsWrapper');
    const toastEl = $('toastMsg');
    const modalOverlay = $('editModalOverlay');
    const dropdownMenu = $('dropdownMenu');
    const moreBtn = $('moreBtn');

    function safeGet(key) {
        try { return localStorage.getItem(key); } catch(e) { return null; }
    }
    function safeSet(key, value) {
        try { localStorage.setItem(key, value); return true; }
        catch(e) { showToast(t('storageFull')); return false; }
    }
    function safeRemove(key) {
        try { localStorage.removeItem(key); } catch(e) {}
    }

    let toastTimer = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function getIcon(id) {
        const tpl = document.getElementById('icon-' + id);
        return tpl ? tpl.innerHTML : '';
    }
    const icons = {
        clock: getIcon('clock'), plus: getIcon('plus'), star: getIcon('star'), check: getIcon('check'),
        coin: getIcon('coin'), starCoin: getIcon('starCoin'), pencil: getIcon('pencil'), reset: getIcon('reset'),
        baseSalary: getIcon('baseSalary'), performance: getIcon('performance'),
        otherDeduction: getIcon('otherDeduction'), otherAllowance: getIcon('otherAllowance'),
        insurance: getIcon('insurance'), personalTax: getIcon('personalTax'),
        meal: getIcon('meal'), nightAllow: getIcon('nightAllow'), rent: getIcon('rent'),
        mealFee: getIcon('mealFee'), highTemp: getIcon('highTemp'), seniority: getIcon('seniority'),
        globe: getIcon('globe')
    };

    // ===== 语言应用 =====
    function applyI18nToDom() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = t(el.dataset.i18nPlaceholder);
        });
        document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        const langBtnText = $('langBtnText');
        if (langBtnText) langBtnText.textContent = currentLang === 'zh' ? 'English' : '中文';
        const langBtnIcon = $('langBtnIcon');
        if (langBtnIcon) langBtnIcon.innerHTML = icons.globe;
    }

    function setLang(lang) {
        if (lang !== 'en' && lang !== 'zh') return;
        currentLang = lang;
        safeSet(LANG_KEY, lang);
    }

    function initLang() {
        const saved = safeGet(LANG_KEY);
        if (saved === 'en' || saved === 'zh') { currentLang = saved; return; }
        const nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
        currentLang = nav.indexOf('zh') === 0 ? 'zh' : 'en';
    }

    function toggleLang() {
        const next = currentLang === 'zh' ? 'en' : 'zh';
        setLang(next);
        applyI18nToDom();
        renderAll();
        showToast(next === 'en' ? 'Switched to English' : '已切换为中文');
    }

    // ===== 日期工具 =====
    const getDays = (y, m) => new Date(y, m, 0).getDate();
    const getFirstDay = (y, m) => new Date(y, m - 1, 1).getDay();
    const getDataKey = () => STORAGE_PREFIX + year + '_' + month;
    const getSalaryKey = () => SALARY_PREFIX + year + '_' + month;
    const getFullHoursKey = (y, m) => FULL_HOURS_PREFIX + y + '_' + m;

    // ===== 数据加载/保存 =====
    function loadData() {
        const raw = safeGet(getDataKey());
        const days = getDays(year, month);
        data = [];
        if (raw) {
            try {
                const p = JSON.parse(raw);
                data = Array.isArray(p.rows) ? p.rows : [];
            } catch(e) { data = []; }
        }
        data.forEach(d => {
            if (!d || typeof d !== 'object') d = {};
            d.shift = d.shift || '';
            d.normal = d.normal || 0;
            d.overtime = d.overtime || 0;
        });
        while (data.length < days) data.push({ shift:'', normal:0, overtime:0 });
        if (data.length > days) data.length = days;
    }
    function saveData() {
        safeSet(getDataKey(), JSON.stringify({ year, month, rows: data }));
    }
    function clearCurrentMonth() {
        if (confirm(t('confirmClear'))) {
            data = Array(getDays(year, month)).fill(null).map(() => ({ shift:'', normal:0, overtime:0 }));
            saveData();
            refreshAll();
            showToast(t('monthCleared'));
        }
    }
    function loadSalaryConfig() {
        salaryConfig = createDefaultSalaryConfig();
        const raw = safeGet(getSalaryKey());
        if (raw) {
            try {
                const s = JSON.parse(raw);
                salaryConfig = Object.assign(salaryConfig, s);
            } catch(e) {}
        }
    }
    function saveSalaryConfig() {
        safeSet(getSalaryKey(), JSON.stringify(salaryConfig));
    }

    // 标准工时加载：用户手动值优先，其次内置表，最后 0
    function loadFullHours(y, m) {
        const key = getFullHoursKey(y, m);
        let val = safeGet(key);
        // 旧版全局键迁移
        if (val === null) {
            const legacy = safeGet(FULL_HOURS_LEGACY);
            if (legacy !== null) {
                safeSet(key, legacy);
                safeRemove(FULL_HOURS_LEGACY);
                val = legacy;
            }
        }
        // 用户手动值优先
        if (val !== null) {
            const parsed = parseFloat(val);
            fullWorkHours = isNaN(parsed) || parsed < 0 ? 0 : parsed;
            return;
        }
        // 无手动值，查内置表
        const builtin = BUILTIN_HOURS[y + '_' + m];
        fullWorkHours = typeof builtin === 'number' ? builtin : 0;
    }
    function saveFullHours(y, m) {
        safeSet(getFullHoursKey(y, m), String(fullWorkHours));
    }

    // ===== 计算 =====
    function computeWorkStats() {
        let normalTotal = 0, overtimeTotal = 0, holidayTotal = 0;
        data.forEach(d => {
            const n = d.normal || 0, o = d.overtime || 0;
            normalTotal += n;
            if (d.shift === 'holiday') holidayTotal += o;
            else overtimeTotal += o;
        });
        return { total: normalTotal + overtimeTotal, normalTotal, overtimeTotal, holidayTotal };
    }

    function computeOvertimeSalary() {
        let nonHoliday = 0, holidayOvt = 0;
        data.forEach(d => {
            if (d.shift === 'holiday') { holidayOvt += (d.overtime || 0); return; }
            nonHoliday += (d.normal || 0) + (d.overtime || 0);
        });
        const overtimeHrs = Math.max(0, nonHoliday - fullWorkHours);
        const rate = salaryConfig.baseSalary / 21.75 / 8;
        const normalPay = rate * 1.5 * overtimeHrs;
        const holidayPay = rate * 3 * holidayOvt;
        const autoPay = normalPay + holidayPay;
        const finalPay = salaryConfig.manualOvertimePay !== null
            ? salaryConfig.manualOvertimePay
            : autoPay;
        return {
            overtimeHours: overtimeHrs,
            holidayOvertimeHours: holidayOvt,
            normalOvertimePay: normalPay,
            holidayOvertimePay: holidayPay,
            autoOvertimePay: autoPay,
            finalOvertimePay: finalPay,
            hourRate: rate
        };
    }

    function computeSalary() {
        const oRes = computeOvertimeSalary();
        const totalAllHours = data.reduce((s, d) => s + (d.normal || 0) + (d.overtime || 0), 0);
        const autoMeal = totalAllHours * 1;
        const meal = salaryConfig.mealManual !== null ? salaryConfig.mealManual : autoMeal;
        const nightCount = data.filter(d => d.shift === 'night').length;
        const autoNight = nightCount * 30;
        const nightAllow = salaryConfig.nightAllowanceManual !== null
            ? salaryConfig.nightAllowanceManual
            : autoNight;
        const gross = salaryConfig.baseSalary + salaryConfig.performance + salaryConfig.otherAllowance
            + meal + oRes.finalOvertimePay + nightAllow
            + salaryConfig.highTempAllowance + salaryConfig.seniorityAllowance
            - salaryConfig.otherDeduction - salaryConfig.rentDeduction - salaryConfig.mealFeeDeduction;
        const net = gross - salaryConfig.insuranceDeduction - salaryConfig.personalTax;
        return { gross, net, meal, autoMeal, nightAllow, autoNight, overtimeRes: oRes };
    }

    function saveExpandedState() {
        const ids = [...document.querySelectorAll('.section.open')].map(s => s.id).filter(Boolean);
        safeSet(EXPANDED_KEY, JSON.stringify(ids));
    }
    function restoreExpandedState() {
        const raw = safeGet(EXPANDED_KEY);
        if (!raw) return;
        try {
            const ids = JSON.parse(raw);
            if (!Array.isArray(ids)) return;
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.add('open');
                const w = el.querySelector('.card-body-wrapper');
                if (w) w.style.height = 'auto';
            });
        } catch(e) {}
    }

    // ===== 弹窗 =====
    function openModal(idx) {
        selectedDay = idx;
        const row = data[idx] || { shift:'', normal:0, overtime:0 };
        document.querySelectorAll('#modalShiftSelector .shift-option-big')
            .forEach(b => b.classList.toggle('active', b.dataset.shift === row.shift));
        $('modalNormal').value = row.normal;
        $('modalOvertime').value = row.overtime;
        modalOverlay.classList.add('show');
        document.body.classList.add('modal-open');
        setTimeout(() => $('modalOvertime').focus(), 400);
    }
    function closeModal() {
        modalOverlay.classList.remove('show');
        document.body.classList.remove('modal-open');
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    function saveModal() {
        if (selectedDay === null) return;
        data[selectedDay].normal = clamp(parseFloat($('modalNormal').value) || 0, 0, 24);
        data[selectedDay].overtime = clamp(parseFloat($('modalOvertime').value) || 0, 0, 24);
        saveData();
        closeModal();
        refreshAll();
        showToast(t('hoursSaved'));
    }

    let eggClicks = 0, eggTimer = null, eggActive = false;
    function triggerEasterEgg() {
        if (eggActive) return;
        eggActive = true;
        setTimeout(() => { eggActive = false; }, 2000);

        const emojis = ['💰','✨','🌟','💵','🪙','💎','🎉','🧧'];
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 35; i++) {
            const p = document.createElement('span');
            p.textContent = emojis[i % emojis.length];
            const angle = Math.random() * 2 * Math.PI;
            const dist = 150 + Math.random() * 350;
            const dx = Math.cos(angle) * dist;
            const dy = Math.sin(angle) * dist - 120;
            p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${24 + Math.random() * 36}px;pointer-events:none;z-index:9999;transition:all 1.6s cubic-bezier(0.15,0.8,0.2,1);opacity:1;transform:translate(-50%,-50%) scale(0.5);`;
            document.body.appendChild(p);
            requestAnimationFrame(() => {
                p.style.transform = `translate(${dx}px,${dy}px) scale(1) rotate(${Math.random() * 720}deg)`;
                p.style.opacity = '0';
            });
            setTimeout(() => p.remove(), 1800);
        }
        for (let i = 0; i < 10; i++) {
            const big = document.createElement('div');
            big.textContent = ['💎','🌟','🎊'][i % 3];
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            big.style.cssText = `position:fixed;left:${x}px;top:${y - 100}px;font-size:60px;pointer-events:none;z-index:9998;opacity:0;transition:all 2s ease-out;transform:scale(0) rotate(0deg);`;
            document.body.appendChild(big);
            requestAnimationFrame(() => {
                big.style.opacity = '0.9';
                big.style.transform = `scale(1.2) rotate(${Math.random() * 360}deg)`;
                big.style.top = `${y + 200}px`;
            });
            setTimeout(() => {
                big.style.opacity = '0';
                setTimeout(() => big.remove(), 500);
            }, 2000);
        }
        showToast(t('eggText'));
    }

    function renderCalendar() {
        const calArea = $('calendarArea');
        if (!calArea) return;
        const days = getDays(year, month);
        const first = getFirstDay(year, month);
        const start = first === 0 ? 6 : first - 1;
        const labels = { work: t('calDay'), night: t('calNight'), rest: t('calRest'), holiday: t('calHoliday') };
        let html = '<div class="calendar-grid">';
        for (let i = 0; i < start; i++) html += '<div class="cal-day empty"></div>';
        for (let d = 1; d <= days; d++) {
            const row = data[d - 1] || {};
            let cls = 'cal-day';
            if (row.shift) cls += ' ' + row.shift;
            const corner = hasNonDefaultOvertime(row) ? '<div class="corner-tag"></div>' : '';
            const label = row.shift ? `<span class="day-label">${labels[row.shift]}</span>` : '';
            html += `<div class="${cls}" data-day="${d - 1}"><span class="day-number">${d}</span>${label}${corner}</div>`;
        }
        html += '</div>';
        calArea.innerHTML = html;
    }

    function hasNonDefaultOvertime(row) {
        const ot = row.overtime || 0;
        if (row.shift === 'work' || row.shift === 'night') return ot !== DEF_OVERTIME;
        if (row.shift === 'rest' || row.shift === 'holiday') return ot > 0;
        return false;
    }

    function toggleCard(section) {
        const wrapper = section.querySelector('.card-body-wrapper');
        if (!wrapper) return;
        const isOpen = section.classList.contains('open');
        if (isOpen) {
            wrapper.style.height = wrapper.scrollHeight + 'px';
            requestAnimationFrame(() => { wrapper.style.height = '0px'; });
            section.classList.remove('open');
        } else {
            section.classList.add('open');
            wrapper.style.height = wrapper.scrollHeight + 'px';
            const onEnd = () => {
                wrapper.style.height = 'auto';
                wrapper.removeEventListener('transitionend', onEnd);
            };
            wrapper.addEventListener('transitionend', onEnd);
        }
        updateCalendarVisibility();
        saveExpandedState();
    }

                const v = parseFloat(input.value);

    function toggleDropdown(e) { e.stopPropagation(); dropdownMenu.classList.toggle('show'); }

    function changeMonth(delta) {
        let nm = month + delta, ny = year;
        if (nm < 1) { nm = 12; ny--; }
        if (nm > 12) { nm = 1; ny++; }
        if (ny < MIN_YEAR || ny > MAX_YEAR) return;
        year = ny; month = nm;
        loadData();
        loadSalaryConfig();
        loadFullHours(year, month);
        const max = getDays(year, month);
        if (selectedDay == null || selectedDay < 0 || selectedDay >= max) {
            const today = new Date();
            selectedDay = (today.getFullYear() === year && today.getMonth() + 1 === month)
                ? today.getDate() - 1 : 0;
        }
        closeModal();
        renderAll();
    }

    function renderAll() {
        buildSkeleton();
        bindDynamicEvents();
        refreshAll();
        restoreExpandedState();
    }

    function exportBackup() {
        const backup = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key) continue;
            if (key.startsWith(STORAGE_PREFIX) ||
                key.startsWith(SALARY_PREFIX) ||
                key === FULL_HOURS_LEGACY ||
                key.startsWith(FULL_HOURS_PREFIX)) {
                backup[key] = safeGet(key);
            }
        }
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const stamp = now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, '0') +
            String(now.getDate()).padStart(2, '0') + '_' +
            String(now.getHours()).padStart(2, '0') +
            String(now.getMinutes()).padStart(2, '0');
        a.href = url;
        a.download = 'attendance_backup_' + stamp + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast(t('backupExported'));
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const obj = JSON.parse(e.target.result);
                if (typeof obj !== 'object' || obj === null) throw new Error('Invalid');

                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const key = localStorage.key(i);
                    if (key && (key.startsWith(STORAGE_PREFIX) ||
                                key.startsWith(SALARY_PREFIX) ||
                                key === FULL_HOURS_LEGACY ||
                                key.startsWith(FULL_HOURS_PREFIX))) {
                        safeRemove(key);
                    }
                }
                for (const [key, value] of Object.entries(obj)) {
                    if (typeof key !== 'string' || typeof value !== 'string') continue;
                    if (key.startsWith(STORAGE_PREFIX) ||
                        key.startsWith(SALARY_PREFIX) ||
                        key === FULL_HOURS_LEGACY ||
                        key.startsWith(FULL_HOURS_PREFIX)) {
                        safeSet(key, value);
                    }
                }
                const today = new Date();
                let iy = today.getFullYear(), im = today.getMonth() + 1;
                if (iy < MIN_YEAR) { iy = MIN_YEAR; im = 1; }
                year = iy; month = im;
                loadData();
                loadSalaryConfig();
                loadFullHours(year, month);
                const max = getDays(year, month);
                selectedDay = (today.getFullYear() === year && today.getMonth() + 1 === month)
                    ? today.getDate() - 1 : 0;
                if (selectedDay >= max) selectedDay = 0;
                renderAll();
                showToast(t('backupRestored'));
            } catch (err) {
                alert(t('invalidBackup'));
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
        initLang();
        applyI18nToDom();

        const now = new Date();
        let iy = now.getFullYear(), im = now.getMonth() + 1;
        if (iy < MIN_YEAR) { iy = MIN_YEAR; im = 1; }
        if (iy > MAX_YEAR) { iy = MAX_YEAR; im = 12; }
        year = iy; month = im;
        selectedDay = (now.getFullYear() === year && now.getMonth() + 1 === month)
            ? now.getDate() - 1 : 0;
        loadData();
        loadSalaryConfig();
        loadFullHours(year, month);
        bindStaticEvents();
        renderAll();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    if (!nw) return;
                    nw.addEventListener('statechange', () => {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                            showToast(t('newVersion'));
                        }
                    });
                });
            }).catch(err => console.log('SW register failed', err));
        }
    });
})();
</script>
</body>
</html>
